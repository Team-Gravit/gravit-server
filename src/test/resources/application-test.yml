spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true # 쿼리 확인을 위해 true 권장
    open-in-view: false

  # Spring AI 스타터는 api-key가 비어 있으면 컨텍스트 기동을 거부한다.
  # 테스트에서 LLM을 실호출하지 않으므로 기동 보장용 더미 값만 둔다.
  ai:
    openai:
      base-url: http://localhost:4000
      api-key: test-key
      chat:
        options:
          model: codex-terra
      audio:
        transcription:
          options:
            model: gpt-transcribe
            language: ko
            temperature: 0

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: false

  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: gravit4746@gmail.com
    password: testtesttesttest
    properties:
      mail.smtp.debug: true
      mail.smtp.auth: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.require: true

  security:
    oauth2:
      client:
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
        registration:
          google:
            client-name: google
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: test-redirect-uri
            authorization-grant-type: authorization_code
            scope: profile, email
          kakao:
            client-name: kakao
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: test-redirect-uri
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
          naver:
            client-name: naver
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: test-redirect-uri
            authorization-grant-type: authorization_code
            scope: name,email

