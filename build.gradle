plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.flywaydb.flyway" version "11.7.2"
}

group = 'gravit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Security & OAuth
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Development Tools
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // API Docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testRuntimeOnly 'com.h2database:h2'

    // Test Container
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Spring-Retry
    implementation("org.springframework.retry:spring-retry")
    implementation("org.springframework:spring-aspects")

    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Redis
    implementation "org.springframework.boot:spring-boot-starter-data-redis"

    // monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Database Proxy
    implementation 'net.ttddyy.observation:datasource-micrometer:1.2.0'

    // FCM (Firebase Cloud Messaging)
    implementation 'com.google.firebase:firebase-admin:9.9.0'

    // Spring AI (LLM 게이트웨이 연동)
    implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
}

// 현재 migration 실행까지 테스트 하려면 TestContainer 가 필요할 듯 싶습니다.
flyway {
    url = 'jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1'
    user = 'sa'
    password = ''
    locations = ['filesystem:src/main/resources/db/migration']
    validateMigrationNaming = true
    ignoreMigrationPatterns = ['*:pending']
}


tasks.register('flywayCi') {
    dependsOn 'flywayValidate'
}

tasks.named('build') {
    dependsOn 'flywayCi'
}

tasks.named('bootJar') {
    dependsOn 'flywayCi'
}

tasks.named('bootRun') {
    // bootRun 기본값(optimizedLaunch)은 -XX:TieredStopAtLevel=1로 C1까지만 컴파일한다.
    // 기동은 빨라지지만 정상 상태 처리량이 낮게 나오므로, perf 프로파일 측정에서는 끈다.
    def perfProfileRun = gradle.startParameter.taskRequests*.args.flatten()
            .any { it.toString().contains('spring.profiles.active=perf') }

    optimizedLaunch = !perfProfileRun
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'experiment'
    }
}

tasks.register('experimentTest', Test) {
    group = 'verification'
    description = '트랜잭션 이벤트 리스너 조합 실증 테스트 (CI 기본 실행 제외)'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'experiment'
    }

    shouldRunAfter tasks.named('test')
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped'
    }
}
