name: 프로덕션 서버 롤백

on:
  workflow_dispatch:
    inputs:
      version:
        description: '롤백할 버전 (예: v1.1.0)'
        required: true
        type: string

jobs:
  rollback:
    name: 지정한 버전으로 롤백
    runs-on: ubuntu-latest

    steps:
      - name: 버전 입력 유효성 검사
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "오류: 유효하지 않은 버전 형식입니다: $VERSION"
            exit 1
          fi

      - name: 앱센터 서버에 롤백 배포
        uses: appleboy/ssh-action@master
        env:
          VERSION: ${{ github.event.inputs.version }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        with:
          host: ${{secrets.APPCENTER_SERVER_IP}}
          username: ${{secrets.APPCENTER_SERVER_USERNAME}}
          password: ${{secrets.APPCENTER_SERVER_PASSWORD}}
          port: ${{secrets.APPCENTER_SERVER_PORT}}
          envs: VERSION,DOCKER_HUB_USERNAME
          script: |
            cd /home/serverking/gravit/prod

            echo "DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME" > .env
            echo "IMAGE_TAG=$VERSION" >> .env

            docker-compose -f docker-compose-prod.yml pull
            docker-compose -f docker-compose-prod.yml down
            docker-compose -f docker-compose-prod.yml up -d --force-recreate
