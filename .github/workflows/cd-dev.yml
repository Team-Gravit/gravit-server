name: 테스트 서버 CD

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: 빌드 후 도커 허브에 푸쉬
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: JDK 버전 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: application-dev.yml 환경변수 주입
        uses: microsoft/variable-substitution@v1
        with:
          files: ./src/main/resources/application-dev.yml
        env:
          spring.datasource.url: ${{secrets.POSTGRESQL_DEV_URL}}
          spring.datasource.username: ${{secrets.POSTGRESQL_USERNAME}}
          spring.datasource.password: ${{secrets.POSTGRESQL_PASSWORD}}
          jwt.secret: ${{secrets.DEV_JWT_SECRET}}

          spring.flyway.user: ${{secrets.POSTGRESQL_USERNAME}}
          spring.flyway.password: ${{secrets.POSTGRESQL_PASSWORD}}

          spring.mail.password: ${{secrets.STMP_PASSWORD}}

          spring.security.oauth2.client.registration.google.client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          spring.security.oauth2.client.registration.google.client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.google.redirect-uri: ${{ secrets.DEV_GOOGLE_REDIRECT_URI }}

          spring.security.oauth2.client.registration.kakao.client-id: ${{ secrets.KAKAO_CLIENT_ID }}
          spring.security.oauth2.client.registration.kakao.client-secret: ${{ secrets.KAKAO_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.kakao.redirect-uri: ${{ secrets.DEV_KAKAO_REDIRECT_URI }}

          spring.security.oauth2.client.registration.naver.client-id: ${{ secrets.NAVER_CLIENT_ID }}
          spring.security.oauth2.client.registration.naver.client-secret: ${{ secrets.NAVER_CLIENT_SECRET }}
          spring.security.oauth2.client.registration.naver.redirect-uri: ${{ secrets.DEV_NAVER_REDIRECT_URI }}

          oauth.android.google.client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          oauth.android.kakao.client-id: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          oauth.ios.google.client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          oauth.ios.kakao.client-id: ${{ secrets.KAKAO_NATIVE_APP_KEY }}

          oauth.apple.team-id: ${{ secrets.APPLE_TEAM_ID }}
          oauth.apple.client-id: ${{ secrets.APPLE_CLIENT_ID }}
          oauth.apple.ios-bundle-id: ${{ secrets.APPLE_IOS_BUNDLE_ID }}
          oauth.apple.key-id: ${{ secrets.APPLE_KEY_ID }}
          oauth.apple.private-key: ${{ secrets.APPLE_PRIVATE_KEY }}
          oauth.apple.token-encryption-key: ${{ secrets.DEV_APPLE_TOKEN_ENCRYPTION_KEY }}

          admin.bootstrap.emails: ${{ secrets.ADMIN_BOOTSTRAP_EMAILS }}

          spring.ai.openai.api-key: ${{ secrets.LITELLM_MASTER_KEY }}

          aws.s3.bucket: ${{ secrets.DEV_S3_INTERVIEW_AUDIO_BUCKET }}
          aws.s3.access-key: ${{ secrets.DEV_S3_ACCESS_KEY }}
          aws.s3.secret-key: ${{ secrets.DEV_S3_SECRET_KEY }}

      - name: Firebase 서비스 계정 키 파일 생성
        run: |
          mkdir -p ./src/main/resources/firebase
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ./src/main/resources/firebase/firebase_service_key.json

      - name: JAR 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test -i --no-daemon -Dspring.profiles.active=dev

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}}
          password: ${{secrets.DOCKER_HUB_PASSWORD}}

      - name: 도커 이미지 빌드
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/gravit-server:dev .

      - name: 도커 이미지 푸쉬
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/gravit-server:dev

  deploy:
    name: 앱센터 서버에 배포
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: docker-compose-dev.yml 파일 전송
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{secrets.APPCENTER_SERVER_IP}}
          username: ${{secrets.APPCENTER_SERVER_USERNAME}}
          password: ${{secrets.APPCENTER_SERVER_PASSWORD}}
          port: ${{secrets.APPCENTER_SERVER_PORT}}
          source: "docker-compose-dev.yml,infra/config.alloy,infra/loki-config.yml"
          target: "/home/serverking/gravit/dev"

      - name: 앱센터 서버에 배포
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        with:
          host: ${{secrets.APPCENTER_SERVER_IP}}
          username: ${{secrets.APPCENTER_SERVER_USERNAME}}
          password: ${{secrets.APPCENTER_SERVER_PASSWORD}}
          port: ${{secrets.APPCENTER_SERVER_PORT}}
          envs: DOCKER_HUB_USERNAME
          script: |
            cd /home/serverking/gravit/dev

            echo "DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME" > .env

            # LLM 게이트웨이(litellm-gw)와 통신할 외부 네트워크. 없으면 만들어 compose 기동이 막히지 않게 한다.
            docker network inspect llm-net >/dev/null 2>&1 || docker network create llm-net

            # Alloy 읽기 위치를 볼륨으로 옮긴다 (볼륨이 없을 때 한 번만).
            # 위치를 잃으면 남은 로그 파일을 처음부터 다시 보내 Loki에 수집 시각으로 중복 저장된다.
            if ! docker volume inspect gravit-alloy-dev-data >/dev/null 2>&1 && docker inspect alloy-dev >/dev/null 2>&1; then
              docker volume create gravit-alloy-dev-data >/dev/null
              docker cp alloy-dev:/data-alloy - | docker run --rm -i -v gravit-alloy-dev-data:/v alpine tar xf - -C /v --strip-components=1
            fi

            # logback 파일 이름이 info.날짜.번호.log로 바뀌어 예전 형식(info.날짜.log)은 logback이 지우지 않는다.
            # 예전 보관 기간(7일)이 지난 것만 지운다. 그 안의 파일은 Alloy가 이미 보냈다. 대상이 없으면 아무 일도 하지 않는다.
            docker run --rm -v "$PWD/logs":/logs alpine \
              find /logs -name '*.[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].log' -mtime +7 -delete

            # 인프라 서비스: compose 설정이 변경된 경우에만 재시작
            docker-compose -f docker-compose-dev.yml up -d --no-deps gravit-redis-dev loki alloy-dev

            # 앱 서버: 항상 최신 이미지로 재시작
            docker-compose -f docker-compose-dev.yml pull gravit-server-dev
            docker-compose -f docker-compose-dev.yml up -d --no-deps --force-recreate gravit-server-dev

            # 새 이미지를 받으며 태그가 빠진 이전 gravit-server 이미지만 지운다.
            # 공용 서버라 다른 팀 이미지까지 지우는 전체 prune(docker image prune)은 쓰지 않는다.
            docker images "$DOCKER_HUB_USERNAME/gravit-server" --filter dangling=true -q | \
              xargs -r docker rmi 2>/dev/null || true
