services:
  gravit-server-dev:
    container_name: gravit-server-dev
    image: ${DOCKER_HUB_USERNAME}/gravit-server:dev
    ports:
      - "8521:8080"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - gravit-dev
      - llm-net
    volumes:
      - ./logs:/var/log/spring
    depends_on:
      gravit-redis-dev:
        condition: service_started


  gravit-redis-dev:
    container_name: gravit-redis-dev
    image: redis:latest
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    networks:
      - gravit-dev
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M

  loki:
    image: grafana/loki:3.5.5
    container_name: gravit-loki-dev
    command: [ "-config.file=/etc/loki/config.yml" ]
    volumes:
      - ./infra/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - gravit-dev

  alloy-dev:
    image: grafana/alloy:latest
    container_name: alloy-dev
    ports:
      - "12346:12345"
    volumes:
      - ./logs:/var/log/spring
      - ./infra/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      - ALLOY_ENV=dev
    command: ["run", "/etc/alloy/config.alloy"]
    networks:
      - gravit-dev

volumes:
  redis_data:
  loki_data:

networks:
  gravit-dev:
    driver: bridge
  # LLM 게이트웨이(LiteLLM, llm-net 상 이름 litellm-gw)가 속한 서버 공용 네트워크. 배포 스크립트가 존재를 보장한다.
  llm-net:
    external: true
